name: Prepare release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.repository == 'NCUPHY-LTLab/orcapen-sc-pdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)"
      - run: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: "pages.yml", branch: "main", per_page: 100});
            const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha && r.conclusion === "success" && r.event === "push" && r.head_branch === "main");
            if (!run) core.setFailed("No successful main Pages run exists for this exact revision");
            else core.setOutput("run_id", String(run.id));
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.pages.outputs.run_id }}
      - run: tar -czf docs-site.tar.gz -C docs/_site .
      - run: uv build --no-sources
      - run: sha256sum docs-site.tar.gz dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            docs-site.tar.gz
            dist/*
            SHA256SUMS
