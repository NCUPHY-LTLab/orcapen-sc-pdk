name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - run: uv sync -p 3.12 --locked --group docs --extra dev
      - run: uv run --group docs python scripts/sync_qmd_notebooks.py notebooks/src notebooks
      - run: uv run --group docs python scripts/build_overview_snippets.py
      - run: uv run --group docs quarto render docs --no-execute
      - run: python scripts/check_docs_navigation.py docs/_site
      - run: python scripts/fetch_previous_docs_release.py docs/releases-history.json "${RUNNER_TEMP}/docs-history-assets" --current-version "$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)" --output-manifest "${RUNNER_TEMP}/docs-history-manifest.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/assemble_docs_release.py docs/_site docs/_release-site --version "$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)" --source-sha "${GITHUB_SHA}" --pages-run "${GITHUB_RUN_ID}" --history-manifest "${RUNNER_TEMP}/docs-history-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_release-site
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
