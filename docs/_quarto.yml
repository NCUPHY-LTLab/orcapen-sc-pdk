project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "home/*.md"
    - "start/*.qmd"
    - "features/scgsim-integration.md"
    - "features/docs-theme.md"
    - "public-pdk-examples/*.md"
    - "public-pdk-examples/*.qmd"
    - "usage/*.md"
    - "simulation/**/*.qmd"
    - "papers/*.md"
    - "notebooks/Public_Docs/component_gallery.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/SimplePad/aedt_q3d.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/SimplePad/aedt_hfss_eigenmode.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/SimplePad/palace_electrostatic.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/SimplePad/palace_eigenmode.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CircularPad/palace_eigenmode.ipynb"
    # Render these canonical sources beside their companion-relative resources.
    - "notebooks/src/SCGSimExamples/SurfaceBands/SimplePad/aedt_q2d_interfaces.qmd"
    - "notebooks/src/SCGSimExamples/SurfaceBands/SimplePad/palace_eigenmode_bands.qmd"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_electrostatic.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_electrostatic.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/aedt_q3d.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/electrostatic_boundary_alignment.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_driven_terminal.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwFiniteGround/aedt_hfss_driven_modal.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwFiniteGround/aedt_hfss_eigenmode.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwFiniteGround/palace_eigenmode.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwFiniteGround/aedt_q3d.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_eigenmode_rlc.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_lumped.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_wave.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/GeometrySemantics/geometry_source_ownership.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/GeometrySemantics/geometry_curves_holes_transforms.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/GeometrySemantics/geometry_multilevel_contacts.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/TSV/aedt_q3d.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/TSV/aedt_hfss_eigenmode.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/TSV/aedt_hfss_driven_terminal.ipynb"
    - "notebooks/SCGSimExamples/CrossSectionSimulation/CpwFiniteGround/aedt_q2d.ipynb"
    - "reference/*.qmd"
  resources:
    - askr-versions.json
    - _static/images/components/*.svg
    - _static/images/test-components/*
    - _static/images/scgsim-examples/*
    - "notebooks/src/SCGSimExamples/_images/*"
    - "notebooks/SCGSimExamples/ComponentSimulation/SimplePad/*.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CircularPad/*.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/*.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/CpwMeanderAirbridge/*.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/GeometrySemantics/*.ipynb"
    - "notebooks/SCGSimExamples/ComponentSimulation/TSV/*.ipynb"
    - "notebooks/SCGSimExamples/CrossSectionSimulation/CpwFiniteGround/*.ipynb"
    - "notebooks/SCGSimExamples/**/*.ipynb"
    - "notebooks/src/SCGSimExamples/**/*.qmd"
    - "notebooks/src/SCGSimExamples/SurfaceBands/SimplePad/simplepad_interface_model.json"
    - "notebooks/src/ComponentSimulation/Kosen2024_Xmon/**/*.qmd"
  pre-render:
    - uv run --project .. --group docs quartodoc build
  post-render:
    - python3 ../scripts/copy_surface_band_sources.py

website:
  title: "OrcaPen SC PDK"
  site-url: https://ncuphy-ltlab.github.io/orcapen-sc-pdk/
  favicon: assets/orcapen-mark.svg
  repo-url: https://github.com/NCUPHY-LTLab/orcapen-sc-pdk
  repo-actions: [edit, issue]
  navbar:
    logo: assets/orcapen-mark.svg
    search: true
    left:
      - text: Get Started
        href: getting-started.md
      - text: Simulation
        href: notebooks.qmd
      - text: API
        href: api.qmd
      - text: Research
        href: paper-review.md
      - text: Development
        href: developing-features.md
  sidebar:
    - id: get-started
      collapse-level: 1
      title: Get Started
      contents:
        - getting-started.md
        - section: Cells
          contents:
            - text: Overview
              href: public-pdk-examples/index.md
            - public-pdk-examples/cross-sections.qmd
        - start/layers.qmd
        - start/materials.qmd
    - id: simulation
      collapse-level: 1
      title: Simulation
      contents:
        - notebooks.qmd
        - simulation/requirements/electrostatic-capacitance.qmd
        - simulation/requirements/eigenmode.qmd
        - simulation/requirements/driven-terminal.qmd
        - simulation/requirements/q2d-cross-section.qmd
        - simulation/requirements/epr-loss.qmd
        - public-pdk-examples/test-components.md
    - id: api
      collapse-level: 1
      title: API
      contents:
        - text: PDK & Technology
          href: api.qmd#pdk-technology
        - text: Cells & Primitives
          href: api.qmd#cells-primitives
        - text: Cross-sections & Ports
          href: api.qmd#cross-sections-ports
        - text: Materials & Interfaces
          href: api.qmd#materials-interfaces
        - section: Generated function reference
          contents:
            - auto: reference
    - id: research
      collapse-level: 1
      title: Research
      contents:
        - paper-review.md
        - papers/transmon-reference-designs.md
        - papers/cpw-resonator-references.md
        - papers/flip-chip-3d-integration.md
        - papers/surface-loss-participation.md
    - id: development
      collapse-level: 1
      title: Development
      contents:
        - developing-features.md
        - home/ecosystem-workspace.md
        - docs-publishing.md

format:
  askr-html:
    css: [styles.css]
    html-math-method: mathjax
    code-copy: true

execute:
  enabled: false

quartodoc:
  style: pkgdown
  dir: reference
  package: orcapen_sc_pdk
  title: API Reference
  sections:
    - title: Package
      desc: Public package entry points.
      contents:
        - activate
        - get_pdk
        - get_sample_functions
    - title: Cells
      desc: Public superconducting and RF layout factories.
      contents:
        - cells.airbridge
        - cells.interdigital_capacitor
        - cells.cpw_t_junction
        - cells.launcher
        - cells.mtl_bend_coupling_section
        - cells.n_trace_mtl_section
        - cells.resonator
        - cells.resonator_hanger
        - cells.resonator_meander
        - cells.finite_ground_cpw_coupon
        - cells.cpw_meander_airbridge_lumped_coupon
        - cells.cpw_meander_airbridge_wave_coupon
        - cells.martinis2022_differential_ribbon_capacitor
    - title: Materials
      desc: Copy-returning public material and interface records.
      contents:
        - materials.get_material_records
        - materials.get_material_alias_records
        - materials.get_interface_preset_records
        - materials.validate_material_kind_records
        - materials.validate_material_alias_records
        - materials.validate_interface_preset_records
        - materials.validate_aedt_material_records
