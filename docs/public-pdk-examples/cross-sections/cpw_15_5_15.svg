<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 826.0" role="img" aria-labelledby="physical-title physical-desc">
<title id="physical-title">cpw_15_5_15 physical face and XY recipe</title>
<desc id="physical-desc">Physical local transverse cut of D1_BOTTOM aluminium 0.1 micrometres on silicon 500 micrometres. Vertical scale is exaggerated and broken. Outer ground, where shown, continues beyond an illustrative crop and has no assigned finite width. Separate XY section-record bars follow.</desc>
