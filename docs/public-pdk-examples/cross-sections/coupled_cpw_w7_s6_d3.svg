<title id="physical-title">coupled_cpw_w7_s6_d3 physical face and XY recipe</title>
<desc id="physical-desc">Physical local transverse cut of D0_TOP aluminium 0.1 micrometres on silicon 500 micrometres. Vertical scale is exaggerated and broken. Outer ground, where shown, continues beyond an illustrative crop and has no assigned finite width. Separate XY section-record bars follow.</desc>
