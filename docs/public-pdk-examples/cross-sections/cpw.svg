<text x="900" y="183" font-size="13">z = 0..0.1 µm</text>
<text x="900" y="203" font-size="13">outward +Z</text>
<text x="555" y="110" text-anchor="middle" font-size="14">Adjacent vacuum / gap</text>
<rect x="230.0" y="155" width="121.875" height="16" fill="#88E6DA" stroke="#344854"/>
<rect x="462.67045454545456" y="155" width="184.65909090909093" height="16" fill="#88E6DA" stroke="#344854"/>
<rect x="758.125" y="155" width="121.875" height="16" fill="#88E6DA" stroke="#344854"/>
<text x="555.0" y="143" text-anchor="middle" font-size="14">cpw_draw: 10 µm</text>
<text x="407.2727272727273" y="194" text-anchor="middle" font-size="13">slot 6</text>
<text x="702.7272727272727" y="194" text-anchor="middle" font-size="13">slot 6</text>
<path d="M230 148 V178 M880 148 V178" stroke="#172b3a" stroke-dasharray="3 3"/>
