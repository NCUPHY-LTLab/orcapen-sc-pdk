<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 826.0" role="img" aria-labelledby="physical-title physical-desc">
<title id="physical-title">cpw physical face and XY recipe</title>
<desc id="physical-desc">Physical local transverse cut of D0_TOP aluminium 0.1 micrometres on silicon 500 micrometres. Vertical scale is exaggerated and broken. Outer ground, where shown, continues beyond an illustrative crop and has no assigned finite width. Separate XY section-record bars follow.</desc>
<rect width="1080" height="826.0" fill="white"/>
<g font-family="sans-serif" fill="#172b3a">
<text x="20" y="28" font-size="22" font-weight="bold">cpw · physical face cut</text>
<text x="20" y="53" font-size="15">D0_TOP · local transverse x / stack z · face-local schematic, not a solver model</text>
<text x="20" y="76" font-size="14">Z scale exaggerated and broken; only this face and its substrate are shown</text>
<rect x="230" y="171" width="650" height="117" fill="#7CB342" stroke="#344854"/>
<text x="555" y="229.5" text-anchor="middle" font-size="17">Si substrate · thickness 500 µm</text>
<text x="555" y="252.5" text-anchor="middle" font-size="14">z = -500..0 µm · cropped / broken vertical scale</text>
<path d="M220 229.5 l10 -7 l10 14 l10 -7 M860 229.5 l10 -7 l10 14 l10 -7" fill="none" stroke="#172b3a" stroke-width="2"/>
<path d="M185 282 V106 m-5 8 l5 -8 l5 8" fill="none" stroke="#172b3a" stroke-width="2"/>
<text x="172" y="103" font-size="17">+z</text>
