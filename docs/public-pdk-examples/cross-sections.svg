<text x="420" y="64" text-anchor="middle" font-size="12">S = 6</text>
<text x="500" y="64" text-anchor="middle" font-size="12">W = 10</text>
<text x="580" y="64" text-anchor="middle" font-size="12">S = 6</text>
<path d="M390 207 V221" stroke="#738da4" fill="none"/>
