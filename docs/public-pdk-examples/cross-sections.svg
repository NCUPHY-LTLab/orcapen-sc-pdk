<path d="M200 84 V111 M800 84 V111" stroke="#172b3a" stroke-dasharray="3 3"/>
<text x="500" y="270" text-anchor="middle" font-size="13">Outer grounds cropped at illustration edges; no finite ground width selected.</text>
</g>
