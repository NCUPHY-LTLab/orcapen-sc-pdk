<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title description">
<title id="title">OrcaPen transverse cross-section schematics</title>
<desc id="description">Source-derived CPW, additive strip, and coupled CPW on D0 top: 0.1 micrometre aluminium above 500 micrometres silicon. Vertical scale is broken and exaggerated. Outer ground is cropped and has no selected finite width. The coupled central ground is 3 micrometres wide, between two 6 micrometre slots.</desc>
<rect width="1000" height="850" fill="white"/>
<g font-family="sans-serif" fill="#172b3a" font-size="15">
<g transform="translate(0 0)">
<text x="35" y="27" font-size="20" font-weight="bold">CPW: W = 10 µm, S = 6 µm</text>
<text x="35" y="50" font-size="13">Local transverse x; path extends out of page</text>
<rect x="200" y="100" width="600" height="105" fill="#cdddec" stroke="#738da4"/>
<text x="500" y="152" text-anchor="middle">Si: z = −500 to 0 µm</text>
<text x="500" y="174" text-anchor="middle" font-size="13">Vertical scale broken; thickness 500 µm</text>
<path d="M190 140 l10 -6 l10 12 l10 -6 M780 140 l10 -6 l10 12 l10 -6" fill="none" stroke="#172b3a" stroke-width="2"/>
<text x="815" y="88">Al: z = 0..0.1 µm</text>
<text x="815" y="107" font-size="12">Thickness exaggerated</text>
<text x="815" y="135">Vacuum above</text>
<path d="M175 210 V70 m-4 7 l4 -7 l4 7" stroke="#172b3a" fill="none"/>
<text x="159" y="69">z</text>
<text x="160" y="107" text-anchor="end" font-size="12">0</text>
<text x="160" y="205" text-anchor="end" font-size="12">−500</text>
<rect x="200" y="88" width="190" height="12" fill="#127d85" stroke="#07545a"/>
