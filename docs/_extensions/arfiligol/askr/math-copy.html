<script>
// The render filter owns source identity. This handler only transfers that
// source on an explicit click and exposes it if clipboard access is denied.
const askrMathCopyTimers = new WeakMap();
function askrInitializeMathCopy() {
  document.querySelectorAll('.askr-copyable-math').forEach(component => {
    if (component.closest('.no-math-copy') || component.querySelector('.no-math-copy')) return;
    const actions = document.createElement('div');
    actions.className = 'askr-math-actions';
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'askr-math-copy';
    button.textContent = 'Copy';
    button.setAttribute('aria-label', 'Copy LaTeX');
    const status = document.createElement('span');
    status.className = 'askr-math-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    actions.append(button, status);
    component.prepend(actions);
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', askrInitializeMathCopy);
else askrInitializeMathCopy();
document.addEventListener('click', async (event) => {
  const button = event.target.closest('.askr-math-copy');
  if (!button) return;
  const component = button.closest('.askr-copyable-math');
  const status = component.querySelector('.askr-math-status');
  clearTimeout(askrMathCopyTimers.get(button));
  button.classList.remove('is-copied');
  button.textContent = 'Copy';
  button.disabled = true;
  status.classList.remove('askr-math-status-success');
  status.textContent = '';
  try {
    await navigator.clipboard.writeText(component.dataset.askrTex);
    button.textContent = 'Copied!';
    button.classList.add('is-copied');
    status.classList.add('askr-math-status-success');
    status.textContent = 'Copied';
    askrMathCopyTimers.set(button, setTimeout(() => {
      button.textContent = 'Copy';
      button.classList.remove('is-copied');
      status.textContent = '';
      askrMathCopyTimers.delete(button);
    }, 2000));
  } catch {
    let source = component.querySelector('.askr-math-source');
    if (!source) {
      source = document.createElement('div');
      source.className = 'askr-math-source';
      const textarea = document.createElement('textarea');
      textarea.readOnly = true;
      textarea.spellcheck = false;
      textarea.setAttribute('aria-label', 'LaTeX source');
      textarea.value = component.dataset.askrTex;
      source.append(textarea);
      component.append(source);
    }
    const textarea = source.querySelector('textarea');
    textarea.focus();
    textarea.select();
    status.textContent = 'Copy unavailable. Select the source below to copy manually.';
  } finally {
    button.disabled = false;
  }
});
</script>
