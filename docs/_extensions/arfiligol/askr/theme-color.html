<meta name="theme-color" content="#faf8f8">
<script>
(function () {
  var drawerCoordinator;
  var layoutGateActive = !!document.documentElement;
  var layoutGateReleased = false;
  var layoutDomReady = document.readyState !== "loading";
  var layoutFontsReady = !document.fonts;
  var adaptiveAreasReady = false;
  var versionManifestReady = true;
  var layoutFrame = 0;
  var stableLayoutFrames = 0;
  var previousLayoutGeometry = null;
  var layoutStatus;
  var layoutObserversStarted = false;
  var layoutSizeObserver;
  var layoutHeaderObserver;
  var onLayoutResize;
  var onLayoutFontLoading;
  var onLayoutFontLoaded;
  var onLayoutFontError;
  var onLayoutPagehide;
  var onLayoutPageshow;
  if (layoutGateActive) {
    document.documentElement.classList.add("askr-layout-pending");
    window.setTimeout(showLayoutStatus, 180);
    window.setTimeout(function () { releaseLayoutGate("timeout"); }, 1800);
    document.addEventListener("DOMContentLoaded", function () {
      layoutDomReady = true;
      startLayoutObservers();
      scheduleLayoutCheck();
    }, {once: true});
    if (layoutDomReady) {
      startLayoutObservers();
      scheduleLayoutCheck();
    }
    if (document.fonts) {
      document.fonts.ready.then(function () {
        layoutFontsReady = document.fonts.status !== "loading";
        if (layoutFontsReady) scheduleLayoutCheck();
      }, function () {
        layoutFontsReady = document.fonts.status !== "loading";
        if (layoutFontsReady) scheduleLayoutCheck();
      });
      onLayoutFontLoading = function () {
        layoutFontsReady = false;
        resetLayoutStability();
      };
      onLayoutFontLoaded = function () {
        layoutFontsReady = document.fonts.status === "loaded";
        resetLayoutStability();
      };
      onLayoutFontError = function () {
        layoutFontsReady = document.fonts.status !== "loading";
        resetLayoutStability();
      };
      document.fonts.addEventListener("loading", onLayoutFontLoading);
      document.fonts.addEventListener("loadingdone", onLayoutFontLoaded);
      document.fonts.addEventListener("loadingerror", onLayoutFontError);
    }
    onLayoutResize = resetLayoutStability;
    onLayoutPagehide = function () { releaseLayoutGate("pagehide"); };
    onLayoutPageshow = function (event) {
      if (event.persisted) releaseLayoutGate("bfcache");
    };
    window.addEventListener("resize", onLayoutResize);
    window.addEventListener("pagehide", onLayoutPagehide, {once: true});
    window.addEventListener("pageshow", onLayoutPageshow);
  }
  function showLayoutStatus() {
    if (layoutGateReleased) return;
    if (!document.body) {
      window.setTimeout(showLayoutStatus, 50);
      return;
    }
    if (layoutStatus) return;
    layoutStatus = document.createElement("div");
    layoutStatus.id = "askr-layout-status";
    layoutStatus.setAttribute("role", "status");
    layoutStatus.setAttribute("aria-live", "polite");
    layoutStatus.setAttribute("aria-atomic", "true");
    layoutStatus.textContent = /^zh(?:-|$)/i.test(document.documentElement.lang) ? "載入頁面中…" : "Loading page…";
    document.body.appendChild(layoutStatus);
  }
  function startLayoutObservers() {
    if (layoutGateReleased || layoutObserversStarted || !document.body) return;
    layoutObserversStarted = true;
    if (window.ResizeObserver) {
      layoutSizeObserver = new ResizeObserver(resetLayoutStability);
      [document.body, document.querySelector("header.fixed-top"), document.querySelector("#quarto-content")].forEach(function (element) {
        if (element) layoutSizeObserver.observe(element);
      });
    }
    var header = document.querySelector("#quarto-header");
    if (header) {
      layoutHeaderObserver = new MutationObserver(resetLayoutStability);
      layoutHeaderObserver.observe(header, {attributes: true, childList: true, subtree: true, characterData: true});
    }
  }
  function resetLayoutStability() {
    stableLayoutFrames = 0;
    previousLayoutGeometry = null;
    scheduleLayoutCheck();
  }
  function scheduleLayoutCheck() {
    if (!layoutGateActive || layoutGateReleased || !layoutDomReady || !layoutFontsReady || !adaptiveAreasReady || !versionManifestReady || layoutFrame) return;
    layoutFrame = requestAnimationFrame(checkLayoutReadiness);
  }
  function headerOffsetIsCoherent() {
    var header = document.querySelector("header.fixed-top");
    if (!header) return true;
    var padding = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    return Math.abs(padding - header.clientHeight) <= 1.5;
  }
  function layoutGeometry() {
    var header = document.querySelector("header.fixed-top");
    var main = document.querySelector("#quarto-content") || document.querySelector("main");
    var title = document.querySelector("#title-block-header");
    var sidebar = document.querySelector("#quarto-sidebar");
    var announcement = document.querySelector("#quarto-announcement");
    function values(element) {
      if (!element) return [];
      var rect = element.getBoundingClientRect();
      return [rect.top, rect.height, rect.bottom].map(function (value) { return Math.round(value * 10) / 10; });
    }
    return JSON.stringify([
      header && header.clientHeight,
      getComputedStyle(document.body).paddingTop,
      values(header), values(main), values(title), values(sidebar), values(announcement)
    ]);
  }
  function checkLayoutReadiness() {
    layoutFrame = 0;
    if (layoutGateReleased) return;
    if (!layoutDomReady || !layoutFontsReady || !adaptiveAreasReady || !versionManifestReady) {
      stableLayoutFrames = 0;
      previousLayoutGeometry = null;
      return;
    }
    if (!headerOffsetIsCoherent()) {
      stableLayoutFrames = 0;
      previousLayoutGeometry = null;
      layoutFrame = requestAnimationFrame(checkLayoutReadiness);
      return;
    }
    var geometry = layoutGeometry();
    if (geometry === previousLayoutGeometry) stableLayoutFrames += 1;
    else stableLayoutFrames = 0;
    previousLayoutGeometry = geometry;
    if (stableLayoutFrames >= 2) releaseLayoutGate("stable");
    else layoutFrame = requestAnimationFrame(checkLayoutReadiness);
  }
  function markAdaptiveAreasReady() {
    adaptiveAreasReady = true;
    scheduleLayoutCheck();
  }
  function releaseLayoutGate(reason) {
    if (!layoutGateActive || layoutGateReleased) return;
    layoutGateReleased = true;
    if (layoutFrame) cancelAnimationFrame(layoutFrame);
    if (layoutSizeObserver) layoutSizeObserver.disconnect();
    if (layoutHeaderObserver) layoutHeaderObserver.disconnect();
    window.removeEventListener("resize", onLayoutResize);
    window.removeEventListener("pagehide", onLayoutPagehide);
    window.removeEventListener("pageshow", onLayoutPageshow);
    if (document.fonts) {
      document.fonts.removeEventListener("loading", onLayoutFontLoading);
      document.fonts.removeEventListener("loadingdone", onLayoutFontLoaded);
      document.fonts.removeEventListener("loadingerror", onLayoutFontError);
    }
    document.documentElement.classList.remove("askr-layout-pending");
    document.documentElement.dataset.askrLayoutReadyReason = reason;
    if (layoutStatus) layoutStatus.remove();
    layoutStatus = null;
  }
  window.addEventListener("click", coordinateDrawerClick, true);
  function coordinateDrawerClick(event) {
    if (!event.target.closest) return;
    var areaButton = event.target.closest("#quarto-header .navbar-toggler");
    var pagesButton = event.target.closest('[data-bs-toggle="collapse"][data-bs-target=".quarto-sidebar-collapse-item"]:not(#quarto-sidebar-glass)');
    var backdrop = event.target.closest("#qdk-area-glass, #quarto-sidebar-glass");
    if (!drawerCoordinator || !(areaButton || pagesButton || backdrop)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (areaButton || pagesButton) {
      if (window.quartoToggleHeadroom) window.quartoToggleHeadroom();
      var target = areaButton ? "area" : "pages";
      drawerCoordinator.request(drawerCoordinator.isRequested(target) ? null : target);
    } else {
      drawerCoordinator.closeWithoutControl(true);
    }
  }
  function paint() {
    var link = document.querySelector("link#quarto-bootstrap.quarto-color-alternate");
    var on = link && link.getAttribute("rel") === "stylesheet";
    var meta = document.querySelector('meta[name="theme-color"]');
    var canvas = getComputedStyle(document.documentElement).getPropertyValue("--qdk-canvas").trim();
    if (meta && canvas) meta.setAttribute("content", canvas);
    document.documentElement.style.colorScheme = on ? "dark" : "light";
  }
  function hook() {
    requestAnimationFrame(paint);
    // A newly enabled alternate sheet may finish loading after the rel change.
    document.querySelectorAll('link.quarto-color-scheme').forEach(function (sheet) {
      sheet.addEventListener("load", paint);
    });
    new MutationObserver(function () { requestAnimationFrame(paint); }).observe(document.body, {
      attributes: true, attributeFilter: ["class"]
    });
    var link = document.querySelector("link#quarto-bootstrap.quarto-color-alternate");
    if (link) new MutationObserver(function () { requestAnimationFrame(paint); }).observe(link, { attributes: true, attributeFilter: ["rel"] });
    var orig = window.quartoToggleColorScheme;
    if (!orig || orig.__qdk) return;
    window.quartoToggleColorScheme = function () {
      var result = orig.apply(this, arguments);
      requestAnimationFrame(paint);
      return result;
    };
    window.quartoToggleColorScheme.__qdk = true;
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", hook);
  else hook();

  // Quarto owns group selection and persistence. Its grouped-tab runtime updates
  // active classes; mirror those classes into attributes, never a second state.
  function groupedTabs() {
    document.querySelectorAll('.panel-tabset[data-group]').forEach(function (tabset) {
      if (tabset.dataset.askrTabsBound) return;
      tabset.dataset.askrTabsBound = "true";
      var tabs = Array.from(tabset.querySelectorAll(':scope > [role="tablist"] [role="tab"]'));
      // Persisted group choices may activate a tab that Bootstrap did not
      // initialize on load. Initialize every native Tab once for keyboard use.
      if (window.bootstrap) tabs.forEach(function (tab) {
        window.bootstrap.Tab.getOrCreateInstance(tab);
      });
      function sync() {
        tabs.forEach(function (tab) {
          var selected = tab.classList.contains("active");
          tab.setAttribute("aria-selected", selected ? "true" : "false");
          tab.setAttribute("tabindex", selected ? "0" : "-1");
        });
      }
      var observer = new MutationObserver(sync);
      tabs.forEach(function (tab) {
        observer.observe(tab, { attributes: true, attributeFilter: ["class"] });
      });
      // Bootstrap keyboard activation is not a click. After it selects/focuses
      // a tab, route that native activation through Quarto's group click handler;
      // no group or storage logic is duplicated here.
      tabset.addEventListener("keydown", function (event) {
        if (!tabs.includes(event.target) || !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
        requestAnimationFrame(function () {
          var selected = document.activeElement;
          if (tabs.includes(selected) && selected.classList.contains("active")) selected.click();
        });
      }, true);
      sync();
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", groupedTabs);
  else groupedTabs();
  window.addEventListener("pageshow", groupedTabs);

  // Quarto owns announcement content, persistence, and document/sidebar offsets.
  // Keep Askr's overlaid Pages control and Areas panel aligned to that header.
  function announcements() {
    var header = document.getElementById("quarto-header");
    if (!header) return;
    var navbar = header.querySelector(":scope > .navbar");
    var frame;
    function update() {
      frame = null;
      var bounds = header.getBoundingClientRect();
      var top = navbar ? navbar.getBoundingClientRect().top - bounds.top : 0;
      header.style.setProperty("--askr-navbar-top", top + "px");
      header.style.setProperty("--askr-header-height", bounds.height + "px");
    }
    function schedule() {
      if (!frame) frame = requestAnimationFrame(update);
    }
    if (window.ResizeObserver) new ResizeObserver(schedule).observe(header);
    window.addEventListener("resize", schedule);
    window.addEventListener("pageshow", schedule);
    update();
    var announcement = document.getElementById("quarto-announcement");
    if (!announcement) return;
    var chinese = /^zh(?:-|$)/i.test(document.documentElement.lang);
    announcement.setAttribute("role", "region");
    announcement.setAttribute("aria-label", chinese ? "網站公告" : "Site announcement");
    var icon = announcement.querySelector(".quarto-announcement-icon");
    if (icon) icon.setAttribute("aria-hidden", "true");
    var action = announcement.querySelector(".quarto-announcement-action");
    if (!action || action.closest("button")) return;
    var close = document.createElement("button");
    close.type = "button";
    close.className = "askr-announcement-close";
    close.setAttribute("aria-label", chinese ? "關閉公告" : "Close announcement");
    close.title = close.getAttribute("aria-label");
    action.setAttribute("aria-hidden", "true");
    action.before(close);
    close.appendChild(action);
    close.addEventListener("click", function (event) {
      var returnFocus = document.activeElement === close;
      // Keep the original node: Quarto binds its click handler to this icon.
      if (event.target !== action) action.click();
      if (returnFocus && !announcement.isConnected) {
        var entry = Array.from(header.querySelectorAll("a[href], button")).find(function (control) {
          return !control.disabled && control.getClientRects().length && getComputedStyle(control).visibility !== "hidden";
        });
        if (entry) entry.focus();
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", announcements);
  else announcements();

  // Measure the existing inline layout, not a second navigation tree. Quarto /
  // Bootstrap remain the owners of disclosure state and navigation links.
  function adaptiveAreas() {
    var header = document.querySelector("#quarto-header");
    var container = header && header.querySelector(".navbar-container");
    var area = header && header.querySelector("#navbarCollapse");
    var button = header && header.querySelector(".navbar-toggler");
    var brand = header && header.querySelector(".navbar-brand-container");
    if (!container || !area || !button || !brand) {
      markAdaptiveAreasReady();
      return;
    }
    var tools = container.querySelector('.quarto-navbar-tools');
    var collapseTools = tools && area.contains(tools);
    var authoredTools = tools ? Array.from(tools.children).filter(function (el) {
      return !el.matches('.quarto-color-scheme-toggle, .quarto-reader-toggle, .askr-logout, .askr-language-selector');
    }) : [];
    var panelTools;
    if (collapseTools) {
      container.appendChild(tools);
      panelTools = document.createElement('div');
      panelTools.className = 'askr-panel-tools';
      area.appendChild(panelTools);
    }
    var mutations = new MutationObserver(schedule);
    function observe() { mutations.observe(container, { childList: true, subtree: true, characterData: true }); }
    button.setAttribute("aria-label", "Areas");
    button.removeAttribute("role");
    button.title = "Areas";
    var frame;
    var compact;
    var mobileState;
    function update() {
      frame = null;
      // Moving native nodes is presentation only, not a new navigation authority.
      mutations.disconnect();
      if (collapseTools) authoredTools.slice().reverse().forEach(function (el) { tools.insertBefore(el, tools.firstChild); });
      if (tools) container.style.setProperty('--askr-tools-width', tools.getBoundingClientRect().width + 'px');
      var active = document.activeElement;
      var previous = compact;
      var previousMobile = mobileState;
      header.classList.add("askr-areas-measuring");
      header.classList.remove("askr-areas-collapsed");
      var mobile = window.matchMedia("(max-width: 991.98px)").matches;
      mobileState = mobile;
      var list = area.querySelector(".navbar-nav");
      var title = brand.querySelector(".askr-version-title") || brand.querySelector(".navbar-title");
      if (title) title.title = title.textContent.trim();
      var titleFits = !title || title.scrollWidth <= title.clientWidth;
      var linksFit = !list || list.scrollWidth <= area.clientWidth;
      var areaRect = area.getBoundingClientRect();
      var brandRect = brand.getBoundingClientRect();
      var controlsFit = Array.from(container.querySelectorAll(":scope > #quarto-search, :scope > .quarto-navbar-tools")).every(function (control) {
        var rect = control.getBoundingClientRect();
        return !rect.width || rect.right <= areaRect.left || rect.left >= areaRect.right;
      });
      compact = mobile || !titleFits || !linksFit || brandRect.right > areaRect.left || !controlsFit;
      header.classList.toggle("askr-areas-collapsed", compact);
      header.classList.remove("askr-areas-measuring");
      if (compact && collapseTools) authoredTools.forEach(function (el) { panelTools.appendChild(el); });
      if (tools) container.style.setProperty('--askr-tools-width', tools.getBoundingClientRect().width + 'px');
      if (mobile) {
        var left = 0;
        var right = container.getBoundingClientRect().right;
        var gap = parseFloat(getComputedStyle(header.querySelector(".quarto-navbar-tools") || container).columnGap) || 0;
        header.querySelectorAll(".quarto-btn-toggle, #quarto-search").forEach(function (control) {
          var rect = control.getBoundingClientRect();
          if (rect.width && getComputedStyle(control).display !== "none") left = Math.max(left, rect.right);
        });
        header.querySelectorAll(".quarto-navbar-tools, .navbar-toggler").forEach(function (control) {
          var rect = control.getBoundingClientRect();
          if (rect.width) right = Math.min(right, rect.left);
        });
        header.style.setProperty("--askr-brand-left", (left + gap) + "px");
        header.style.setProperty("--askr-brand-right", (container.getBoundingClientRect().right - right + gap) + "px");
      }
      observe();
      if ((previous !== undefined && previous !== compact) || (previousMobile !== undefined && previousMobile !== mobile)) {
        if (drawerCoordinator) drawerCoordinator.closeForBreakpoint(active);
        if (compact && area.contains(active)) button.focus();
        else if (!compact && active === button) {
          var link = area.querySelector("a.nav-link");
          if (link) link.focus();
        }
      }
      markAdaptiveAreasReady();
    }
    function schedule() {
      if (!frame) frame = requestAnimationFrame(update);
    }
    new ResizeObserver(schedule).observe(container);
    // Version and Logout entries are mounted after the original Header.
    observe();
    window.addEventListener("resize", schedule);
    window.addEventListener("pageshow", schedule);
    if (document.fonts) {
      document.fonts.ready.then(schedule);
      document.fonts.addEventListener("loadingdone", schedule);
    }
    schedule();
  }
  function menus() {
    if (!document.querySelector("#qdk-area-glass")) {
      var glass = document.createElement("div");
      glass.id = "qdk-area-glass";
      glass.style.position = "fixed";
      glass.style.inset = "0";
      document.body.appendChild(glass);
    }
    var area = document.querySelector("#navbarCollapse");
    var pages = document.querySelector("#quarto-sidebar");
    var areaGlass = document.querySelector("#qdk-area-glass");
    var pagesGlass = document.querySelector("#quarto-sidebar-glass");
    var areaButton = document.querySelector("#quarto-header .navbar-toggler");
    var pagesControls = Array.from(document.querySelectorAll('[data-bs-toggle="collapse"][data-bs-target=".quarto-sidebar-collapse-item"]:not(#quarto-sidebar-glass)'));
    var pagesButton = pagesControls.find(function (control) { return control.tagName === "BUTTON"; }) || pagesControls[0];
    pagesControls.forEach(function (control) {
      control.setAttribute("aria-label", "Pages");
      control.title = "Pages";
    });
    drawerCoordinator = createDrawerCoordinator(area, pages, areaButton, pagesButton, areaGlass, pagesGlass);
    if (area) {
      area.addEventListener("show.bs.collapse", function (event) {
        if (event.target !== area) return;
        area.classList.add("qdk-open");
        areaGlass.classList.add("qdk-glass-in");
        if (areaButton) areaButton.setAttribute("aria-expanded", "true");
      });
      area.addEventListener("hide.bs.collapse", function (event) {
        if (event.target !== area) return;
        area.classList.remove("qdk-open");
        areaGlass.classList.remove("qdk-glass-in");
        if (areaButton) areaButton.setAttribute("aria-expanded", "false");
      });
    }
    if (pages && pagesGlass) {
      pages.addEventListener("show.bs.collapse", function (event) {
        if (event.target !== pages) return;
        pages.classList.add("qdk-open");
        pagesGlass.classList.add("qdk-glass-in");
        syncPagesGlass(true);
        pagesControls.forEach(function (control) { control.setAttribute("aria-expanded", "true"); });
      });
      pages.addEventListener("hide.bs.collapse", function (event) {
        if (event.target !== pages) return;
        pages.classList.remove("qdk-open");
        pagesGlass.classList.remove("qdk-glass-in");
        syncPagesGlass(false);
        pagesControls.forEach(function (control) { control.setAttribute("aria-expanded", "false"); });
      });
      pages.addEventListener("click", function (event) {
        if (event.target.closest("a, button, .sidebar-item-toggle")) return;
        drawerCoordinator.closeWithoutControl(false);
      });
    }
    if (area) area.addEventListener("click", function (event) {
      if (event.target.closest("a.nav-link") && document.querySelector("#quarto-header.askr-areas-collapsed")) drawerCoordinator.request(null);
    });
    document.addEventListener("click", function (event) {
      if (!drawerCoordinator.isOpen()) return;
      if (event.target.closest && event.target.closest(".askr-language-toggle")) {
        drawerCoordinator.closeWithoutControl(false);
        return;
      }
      if ((area && area.contains(event.target)) || (pages && pages.contains(event.target)) ||
          (areaButton && areaButton.contains(event.target)) || pagesControls.some(function (control) { return control.contains(event.target); }) ||
          (areaGlass && areaGlass.contains(event.target)) || (pagesGlass && pagesGlass.contains(event.target))) return;
      drawerCoordinator.closeWithoutControl(false);
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && drawerCoordinator.isOpen()) {
        event.preventDefault();
        drawerCoordinator.closeAndRestoreFocus();
      }
    });
    calloutControls();
    versions();
    adaptiveAreas();
  }
  function syncPagesGlass(open) {
    var glass = document.querySelector("#quarto-sidebar-glass");
    if (!glass) return;
    glass.classList.toggle("show", open);
    glass.classList.remove("collapse", "collapsing");
    glass.classList.toggle("collapsed", !open);
    glass.style.removeProperty("height");
    glass.style.removeProperty("overflow");
  }
  function createDrawerCoordinator(area, pages, areaButton, pagesButton, areaGlass, pagesGlass) {
    var desired = null;
    var reconciling = false;
    var lastOpened = null;
    var pendingFocus = null;
    var collapse = {
      area: area && window.bootstrap && window.bootstrap.Collapse.getOrCreateInstance(area, {toggle: false}),
      pages: pages && window.bootstrap && window.bootstrap.Collapse.getOrCreateInstance(pages, {toggle: false})
    };
    function current() {
      if (area && (area.classList.contains("show") || area.classList.contains("collapsing") && desired === "area")) return "area";
      if (pages && (pages.classList.contains("show") || pages.classList.contains("collapsing") && desired === "pages")) return "pages";
      return null;
    }
    function reconcile() {
      if (reconciling) return;
      var underway = [area, pages].some(function (el) { return el && el.classList.contains("collapsing"); });
      if (underway) return;
      var open = current();
      if (open && open !== desired) {
        reconciling = true;
        collapse[open].hide();
        reconciling = false;
        return;
      }
      if (desired && !open && collapse[desired]) {
        reconciling = true;
        collapse[desired].show();
        reconciling = false;
      }
    }
    function restoreFocusWhenClosed() {
      if (!pendingFocus || [area, pages].some(function (el) {
        return el && (el.classList.contains("show") || el.classList.contains("collapsing"));
      })) return;
      var control = pendingFocus;
      pendingFocus = null;
      if (control.isConnected) control.focus();
    }
    [area, pages].forEach(function (el) {
      if (!el) return;
      el.addEventListener("shown.bs.collapse", function () {
        reconcile();
        restoreFocusWhenClosed();
      });
      el.addEventListener("hidden.bs.collapse", function () {
        reconcile();
        restoreFocusWhenClosed();
      });
    });
    function request(next) {
      if (next) {
        lastOpened = next;
        pendingFocus = null;
      }
      desired = next;
      reconcile();
    }
    return {
      request: request,
      isOpen: function () {
        return !!current() || !!desired || [area, pages].some(function (el) { return el && el.classList.contains("collapsing"); });
      },
      isRequested: function (target) { return desired === target || (!desired && current() === target); },
      closeAndRestoreFocus: function () {
        closeWithoutControl(true);
      },
      closeForBreakpoint: function (active) {
        closeWithoutControl(false);
        if (area && area.contains(active) && areaButton) areaButton.focus();
        else if (pages && pages.contains(active) && pagesButton) pagesButton.focus();
      },
      closeWithoutControl: closeWithoutControl
    };
    function closeWithoutControl(restoreFocus) {
      var open = current() || desired ||
        (area && area.classList.contains("collapsing") ? "area" : null) ||
        (pages && pages.classList.contains("collapsing") ? "pages" : null) || lastOpened;
      var transitioning = [area, pages].some(function (el) { return el && el.classList.contains("collapsing"); });
      if (!open || !(current() || desired || transitioning)) return;
      if (restoreFocus) pendingFocus = open === "pages" ? pagesButton : areaButton;
      request(null);
      var header = document.querySelector("#quarto-header");
      if (header && header.classList.contains("headroom--frozen") && window.quartoToggleHeadroom) window.quartoToggleHeadroom();
      restoreFocusWhenClosed();
    }
  }
  function calloutControls() {
    document.querySelectorAll('.callout-header[data-bs-toggle="collapse"]').forEach(function (header) {
      if (header.dataset.askrKeyboardBound === "true") return;
      header.dataset.askrKeyboardBound = "true";
      var callout = header.closest(".callout");
      var label = callout && callout.getAttribute("title");
      if (!label) {
        var title = header.querySelector(".callout-title-container");
        if (title) {
          var visibleTitle = title.cloneNode(true);
          visibleTitle.querySelectorAll(".screen-reader-only, .visually-hidden").forEach(function (el) { el.remove(); });
          label = visibleTitle.textContent.trim();
        }
      }
      header.setAttribute("role", "button");
      header.setAttribute("tabindex", "0");
      if (label) {
        header.title = label;
        header.setAttribute("aria-label", label);
      }
      header.addEventListener("keydown", function (event) {
        if (event.target !== header || event.repeat || !["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        header.click();
      });
    });
  }
  function versions() {
    var brand = document.querySelector("#quarto-header .navbar-brand");
    var slot = document.querySelector("#quarto-header .navbar-brand-container");
    if (!brand || !slot) return;
    if (!window.fetch) return;
    versionManifestReady = false;
    var offset = document.querySelector('meta[name="quarto:offset"]');
    var manifest = new URL((offset ? offset.getAttribute("content") : "./") + "askr-versions.json", location.href);
    var local = document.getElementById("askr-versions-local");
    if (local) {
      try { mountVersions(JSON.parse(local.textContent), brand, slot, new URL("./", manifest)); } catch (error) { /* unusable local manifest */ }
    }
    fetch(manifest.href).then(function (response) {
      if (!response.ok) throw new Error("missing");
      return response.json();
    }).then(function (data) {
      mountVersions(data, brand, slot, new URL("./", manifest));
    }).catch(function () {
      if (slot.querySelector(".askr-version")) return;
      var dataEl = document.getElementById("askr-versions");
      if (!dataEl) return;
      try { mountVersions(JSON.parse(dataEl.textContent), brand, slot, new URL("./", manifest)); } catch (error) { return; }
    }).then(function () {
      versionManifestReady = true;
      scheduleLayoutCheck();
    });
  }
  function mountVersions(data, brand, slot, siteRoot) {
    if (!data || !Array.isArray(data.versions) || !data.versions.length) return;
    var signature = JSON.stringify(data);
    var existing = slot.querySelector(".askr-version");
    if (existing && existing.dataset.manifest === signature) return;
    if (existing) existing.remove();
    var params = new URLSearchParams(location.search);
    var mode = params.get("askr-version-mode") === "title" ? "title" : (data.mode === "title" ? "title" : "inline");
    var title = brand.textContent.trim();
    if (params.get("askr-version-mode") === "title" && data.longTitle) title = data.longTitle;
    // Manifest roots are relative to the deployed site, not the origin. Quarto's
    // offset locates that site even from a nested page under a repository prefix.
    function versionRoot(item) {
      var root = item.root || "/";
      var relative = root.replace(/^\/+/, "");
      return new URL(relative ? relative.replace(/\/?$/, "/") : "./", siteRoot);
    }
    function pathMatches(root) {
      var path = location.pathname;
      var normalized = root.pathname;
      return path === normalized.slice(0, -1) || path.indexOf(normalized) === 0;
    }
    function itemHref(item) {
      if (item.href) {
        var fixed = new URL(item.href.replace(/^\/(?!\/)/, ""), siteRoot);
        if (params.get("askr-version-mode")) fixed.searchParams.set("askr-version-mode", params.get("askr-version-mode"));
        return fixed.href;
      }
      var path = location.pathname;
      var bases = data.versions.filter(function (version) { return version.root; })
        .sort(function (a, b) { return versionRoot(b).pathname.length - versionRoot(a).pathname.length; });
      var from = bases.filter(function (version) { return pathMatches(versionRoot(version)); })[0];
      var fromRoot = from ? versionRoot(from) : siteRoot;
      var rest = path.slice(fromRoot.pathname.length);
      var target = new URL(rest, versionRoot(item));
      target.search = location.search;
      target.hash = location.hash;
      return target.href;
    }
    var current = data.versions.filter(function (item) { return item.label === params.get("askr-version"); })[0];
    if (!current) {
      var rooted = data.versions.filter(function (item) { return item.root && pathMatches(versionRoot(item)); })
        .sort(function (a, b) { return b.root.length - a.root.length; });
      current = rooted[0] || data.versions.filter(function (item) { return item.latest; })[0] || data.versions[0];
    }
    var root = document.createElement("div");
    root.className = "askr-version";
    root.dataset.mode = mode;
    root.dataset.manifest = signature;
    var button = document.createElement("button");
    button.type = "button";
    button.className = "askr-version-button";
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-controls", "askr-version-links");
    var titleSpan = document.createElement("span");
    titleSpan.className = "askr-version-title";
    titleSpan.textContent = title;
    button.appendChild(titleSpan);
    if (mode === "inline") {
      var number = document.createElement("span");
      number.className = "askr-version-number";
      number.textContent = current.label;
      button.appendChild(number);
    }
    var chevron = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    chevron.setAttribute("class", "askr-version-chevron");
    chevron.setAttribute("viewBox", "0 0 16 16");
    chevron.setAttribute("aria-hidden", "true");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M4 6l4 4 4-4");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    chevron.appendChild(path);
    button.appendChild(chevron);
    var menu = document.createElement("div");
    menu.className = "askr-version-menu";
    menu.hidden = true;
    menu.id = "askr-version-links";
    data.versions.forEach(function (item) {
      var link = document.createElement("a");
      link.href = itemHref(item);
      link.dataset.versionHome = versionRoot(item).href;
      if (item.label === current.label) link.setAttribute("aria-current", "true");
      var label = document.createElement("span");
      label.textContent = item.label;
      link.appendChild(label);
      if (item.latest) {
        var latest = document.createElement("span");
        latest.className = "askr-version-latest";
        latest.textContent = "Latest";
        link.appendChild(latest);
      }
      menu.appendChild(link);
    });
    function setOpen(open) {
      if (open && drawerCoordinator) drawerCoordinator.closeWithoutControl(false);
      menu.hidden = !open;
      button.setAttribute("aria-expanded", open ? "true" : "false");
    }
    button.addEventListener("click", function (event) {
      event.stopPropagation();
      setOpen(menu.hidden);
    });
    document.addEventListener("click", function (event) {
      if (!root.contains(event.target)) setOpen(false);
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !menu.hidden) {
        event.preventDefault();
        setOpen(false);
        button.focus();
      }
    });
    root.addEventListener("focusout", function (event) {
      if (!root.contains(event.relatedTarget)) setOpen(false);
    });
    root.appendChild(button);
    root.appendChild(menu);
    slot.appendChild(root);
    document.addEventListener("click", function (event) {
      var link = event.target.closest && event.target.closest(".askr-version-menu a");
      if (!link || !root.contains(link)) return;
      var href = link.getAttribute("href");
      if (!href) return;
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.origin !== location.origin) return;
      event.preventDefault();
      fetch(href).then(function (response) {
        if (response.status !== 404) {
          location.assign(href);
          return;
        }
        location.assign(link.dataset.versionHome);
      }).catch(function () {
        location.assign(href);
      });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", menus);
  else menus();
})();
</script>
