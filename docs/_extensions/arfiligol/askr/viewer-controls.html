<script>
// Logout is independent of image viewing and remains plain navigation.
(() => {
  function setup() {
    const template = document.getElementById('askr-logout-config');
    if (template && template.dataset.mounted !== 'true') {
      const tools = document.querySelector('#quarto-header .quarto-navbar-tools');
      if (!tools) return;
      tools.append(template.content.cloneNode(true));
      template.dataset.mounted = 'true';
      document.getElementById('quarto-header').classList.add('askr-has-logout');
    }

  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup, {once: true});
  else setup();
})();
</script>
