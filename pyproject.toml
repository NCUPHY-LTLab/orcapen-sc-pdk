[build-system]
requires = ["uv_build>=0.10.8,<0.12.0"]
build-backend = "orcapen_build"
backend-path = ["."]

[project]
name = "orcapen-sc-pdk"
version = "0.1.0.dev2"
description = "OrcaPen superconducting quantum/RF public PDK for GDSFactory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "OrPenStrike" }]
keywords = [
  "gdsfactory",
  "layout",
  "pdk",
  "quantum",
  "rf",
  "superconducting",
]
dependencies = [
  "doroutes>=0.2.0",
  "gdsfactory~=9.48.0",
  "networkx>=3.0",
  "numpy>=2.0",
  "pydantic>=2",
  "pyyaml>=6.0",
  "typing-extensions>=4.12.0",
]

[project.urls]
documentation = "https://orpenstrike.github.io/orcapen-sc-pdk/"
repository = "https://github.com/OrPenStrike/orcapen-sc-pdk/"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.11",
]
circuit-runtime = ["superconducting-circuits-runtime"]

[dependency-groups]
docs = [
  "griffe<2",
  "ipykernel",
  "jupytext",
  "matplotlib",
  "quartodoc",
]
palace-notebooks = ["scgsim[palace,visualization]"]
aedt-notebooks = ["scgsim[aedt]"]
ecosystem-dev = [
  "kaleido>=1.0.0",
  "pandas>=2.0",
  "plotly>=6.0.0",
]

[tool.uv.sources]
scgsim = { git = "https://github.com/OrPenStrike/scgsim.git", rev = "0051d6e8924d8e79c0e03b560592ec65fe5659a1" }
superconducting-circuits-runtime = { git = "https://github.com/arfiligol/superconducting-circuits-research-workbench.git", rev = "f3430cb3c4b3a72d6b60bc99929475f3d0c41f57", subdirectory = "core/python/runtime" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["orcapen_sc_pdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""
module-name = "orcapen_sc_pdk"
source-include = [
  "orcapen_build.py",
  "docs/usage/*.md",
  "docs/usage/resources.toml",
  "docs/public-pdk-examples/component-authoring.md",
  "notebooks/src/**/*.qmd",
  "notebooks/src/**/*.py",
]

[tool.gdsfactoryplus]
name = "orcapen_sc_pdk"

[tool.gdsfactoryplus.pdk]
name = "orcapen_sc_pdk"
cells_no_model_expected = [
  "indium_bump",
  "indium_ground",
  "resonator",
  "resonator_hanger",
  "resonator_meander",
  "taper",
  "bend_circular",
  "bend_euler",
  "dicing_edge",
  "interdigital_capacitor",
  "launcher",
  "manhattan_style_junction",
  "martinis2022_differential_ribbon_capacitor",
  "straight",
  "cpw_handoff",
  "rounded_end_metal_segment",
  "rounded_rectangle",
  "wire_corner",
]
